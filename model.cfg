class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};

	class skeleton_Dverka: Default
	{
		skeletonBones[] =
		{
			"door1", "" // Корневая кость двери, без родительской кости.
		};
	};
};

class CfgModels
{
	class Default
	{
		sections[] = {};
		sectionsInherit = "";
		skeletonName = "";
	};

	// Имя класса соответствует имени файла Dverka.p3d, а не Land_Dverka.
	class Dverka: Default
	{
		skeletonName = "skeleton_Dverka";
		sectionsInherit = "";
		// Графические секции. Соответствующие selections должны существовать в модели.
		sections[] = {"camo", "door1"};

		class Animations
		{
			class Door1_Rotation
			{
				type = "rotation";
				source = "door1";      // Соответствует class door1 в config.cpp / Doors.
				selection = "door1";   // Кость и selection анимируемой двери.
				axis = "door1_axis";   // Две точки оси в Memory LOD.
				memory = 1;
				minValue = 0.0;
				maxValue = 1.0;
				angle0 = 0.0;
				angle1 = 1.5707963;    // 90 градусов; знак задаёт направление вращения.
			};
		};
	};
};
